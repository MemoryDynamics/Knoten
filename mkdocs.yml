site_name: Memory Dynamics
site_description: Documentation for the finite-memory Memory Dynamics research project.
repo_url: https://github.com/MemoryDynamics/Knoten
docs_dir: docs

theme:
  name: readthedocs

nav:
  - Start: index.md
  - Projektsteuerung:
      - Aktueller Stand: status/current_status.md
      - Prioritaeten: status/project_priorities.md
      - Forschungsroadmap: status/research_roadmap.md
      - Architekturentscheidung: status/architecture_decision.md
      - Paper-Claims: status/paper_claims.md
  - Modell und Gleichungen:
      - Theorie: reference/THEORETICAL_CONTEXT.md
      - Modellvokabular: reference/model_vocabulary.md
      - Implementierte Gleichungen: reference/implemented_equations.md
      - Physikalische Machbarkeit: reference/foundation_feasibility.md
      - Zustand und Interventionen: reference/operational_contract.md
      - Wasserstoff und Materie:
          - Zielbenchmark: reference/hydrogen_benchmark.md
          - Direkter Paar-Audit: reference/hydrogen_pair_audit.md
          - Memory-Paarreduktion: reference/memory_pair_reduction.md
          - Lesepotential und FIFO-Bilanz: reference/memory_pair_energy.md
          - Form und gemittelte Paarwirkung: reference/memory_pair_finite_separation.md
          - Referenz und Emergenz: reference/matter_reference_contract.md
          - Raeumliche Nukleonreferenz: reference/nucleon_spatial_reference.md
      - Center-Filter und Rotation: reference/scalar_memory_center_filter.md
  - Rotation und Interaktion:
      - Native Rotating Waves: reference/rotating_wave_foundation.md
      - FIFO-Strukturkandidat: reference/fifo_structure_candidate.md
      - FIFO-Normalstabilitaet: reference/fifo_normal_stability_contract.md
      - FIFO-Strukturgrenzen: reference/fifo_rigid_structure_limits.md
      - Horizonttransfer erklaert: reference/horizon_transfer_guide.md
      - P4-R-S allgemein erklaert: status/p4rs_plain_language_summary.md
  - Experimente: reference/experiment_catalog.md
  - Repository: reference/repository_map.md
  - Diskussion und Einstieg:
      - Artikel (Deutsch): outreach/medium_entwurf.md
      - Article (English): outreach/medium_draft_en.md
      - Mitpruefen (Deutsch): outreach/mitpruefen.md
      - Contribute a review (English): outreach/contribute_review_en.md

exclude_docs: |
  archive/**
  historical/**
  overview/**

markdown_extensions:
  - admonition
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
